name: Release

# Мерж в main только обновляет релизный PR. Мерж этого PR выпускает релиз,
# и релиз уезжает на сервер. Ручной запуск деплоит любой релизный тег, например
# чтобы откатиться.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Publish candidate images without deploying
        type: boolean
        default: false
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Деплои идут по одному, новый не прерывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: aimuzov/.github/.github/workflows/release.yml@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Пока сервер не готов (ключ, клон в /srv, сайт в Caddy), деплой пропускается.
  # Включается переменной репозитория DEPLOY_ENABLED=true.
  deploy:
    needs: [release, check]
    # `!cancelled()`, а не `always()`: job идёт и при пропущенных release и check
    # (ручной запуск), но отменённый прогон не деплоит.
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR != 'true' && !inputs.build_only &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sublya.aimuzov.online
    steps:
      - uses: aimuzov/infra-site-kit/deploy@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://sublya.aimuzov.online/
          health-url: https://sublya.aimuzov.online/admin/api/health
          ref: ${{ needs.release.outputs.tag || inputs.tag }}

  build-site:
    needs: [release, check]
    if: >-
      !cancelled() && (inputs.build_only || (vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR == 'true' && (needs.release.outputs.tag || inputs.tag) != '' && (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')))
    permissions:
      contents: read
      packages: write
    uses: aimuzov/infra-ci/.github/workflows/build-image.yml@3e762ccf913fdea02f1e43312270c7a4a7e9d335
    with:
      ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}
      image-suffix: '-site'
      dockerfile: deploy/frontend.Dockerfile
    secrets:
      build-env: ${{ format('PUBLIC_SENTRY_DSN={0}', vars.PUBLIC_SENTRY_DSN) }}

  build-bot:
    needs: [release, check]
    if: >-
      !cancelled() && (inputs.build_only || (vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR == 'true' && (needs.release.outputs.tag || inputs.tag) != '' && (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')))
    permissions:
      contents: read
      packages: write
    uses: aimuzov/infra-ci/.github/workflows/build-image.yml@3e762ccf913fdea02f1e43312270c7a4a7e9d335
    with:
      ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}
      image-suffix: '-bot'
      dockerfile: deploy/bot.Dockerfile

  deploy-registry:
    needs: [release, build-site, build-bot]
    if: >-
      !cancelled() && !inputs.build_only && needs.build-site.result == 'success' && needs.build-bot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - id: request
        env:
          TAG: ${{ needs.release.outputs.tag || inputs.tag }}
          REVISION: ${{ needs.build-site.outputs.revision }}
          IMAGE_SITE: ${{ needs.build-site.outputs.image }}
          IMAGE_BOT: ${{ needs.build-bot.outputs.image }}
          BOT_REVISION: ${{ needs.build-bot.outputs.revision }}
        run: |
          [[ "$REVISION" == "$BOT_REVISION" ]]
          printf 'value=images %s %s %s\n' "$TAG" "$REVISION" "${IMAGE_SITE##*@} ${IMAGE_BOT##*@}" >> "$GITHUB_OUTPUT"
      - uses: aimuzov/infra-site-kit/deploy@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://sublya.aimuzov.online/
          health-url: https://sublya.aimuzov.online/admin/api/health
          ref: ${{ steps.request.outputs.value }}
